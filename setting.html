<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Setting App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:#0f172a;
min-height:100vh;
overflow-x:hidden;
color:white;
padding:16px;
}

.bg{
position:fixed;
inset:0;
background:
radial-gradient(circle at top left,#2563eb55,transparent 35%),
radial-gradient(circle at bottom right,#06b6d455,transparent 35%),
linear-gradient(135deg,#020617,#0f172a,#111827);
z-index:-2;
}

.blur1,
.blur2{
position:fixed;
border-radius:50%;
filter:blur(100px);
z-index:-1;
}

.blur1{
width:260px;
height:260px;
background:#2563eb55;
top:-70px;
left:-70px;
}

.blur2{
width:260px;
height:260px;
background:#06b6d455;
bottom:-70px;
right:-70px;
}

.container{
max-width:480px;
margin:auto;
padding-bottom:100px;
}

.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(24px);
border:1px solid rgba(255,255,255,0.08);
border-radius:32px;
padding:22px;
box-shadow:0 10px 40px rgba(0,0,0,0.35);
}

.header{
text-align:center;
margin-bottom:24px;
}

.logo{
font-size:34px;
font-weight:900;
letter-spacing:3px;
background:linear-gradient(90deg,#60a5fa,#22d3ee);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{
margin-top:6px;
font-size:13px;
color:#94a3b8;
}

.section{
margin-bottom:18px;
padding:18px;
border-radius:24px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.06);
}

.section-title{
font-size:14px;
font-weight:800;
margin-bottom:14px;
color:#e2e8f0;
}

input{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid rgba(255,255,255,0.08);
background:rgba(255,255,255,0.06);
color:white;
outline:none;
margin-bottom:10px;
}

input:focus{
border-color:#38bdf8;
box-shadow:0 0 0 3px rgba(56,189,248,0.15);
}

button{
border:none;
cursor:pointer;
border-radius:14px;
color:white;
font-weight:700;
}

.btn-primary{
width:100%;
padding:14px;
background:linear-gradient(135deg,#2563eb,#06b6d4);
}

.btn-green{
width:100%;
padding:14px;
margin-top:12px;
background:linear-gradient(135deg,#059669,#10b981);
}

.btn-gray{
width:100%;
padding:14px;
margin-top:14px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
}

/* ITEM CARD */
.row{
display:flex;
align-items:center;
gap:10px;
padding:14px;
margin-top:10px;
border-radius:18px;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
}

.item-info{
flex:1;
min-width:0;
}

.item-name{
font-size:15px;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.item-price{
font-size:12px;
color:#94a3b8;
margin-top:3px;
}

.price-input{
width:85px;
padding:10px;
border-radius:12px;
text-align:center;
margin:0;
}

.icon-btn{
width:42px;
height:42px;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center;
}

.plus-btn{
background:linear-gradient(135deg,#2563eb,#06b6d4);
font-size:20px;
}

.delete-btn{
background:rgba(239,68,68,0.15);
border:1px solid rgba(239,68,68,0.25);
}

/* FAB */
.fab{
position:fixed;
bottom:18px;
right:18px;
width:60px;
height:60px;
border-radius:50%;
background:linear-gradient(135deg,#2563eb,#06b6d4);
font-size:28px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
z-index:999;
}

.empty{
text-align:center;
padding:18px;
color:#94a3b8;
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="blur1"></div>
<div class="blur2"></div>

<div class="container">

<div class="card">

<div class="header">
<div class="logo">MAQSHOF</div>
<div class="sub">SETTING PANEL</div>
</div>

<!-- LABEL -->
<div class="section">
<div class="section-title">🏷️ Custom Label</div>
<input id="labelApp" placeholder="Contoh : Kantin / Kas / Inventaris">
<button class="btn-primary" onclick="saveLabel()">Simpan Label</button>
</div>

<!-- THEME -->
<div class="section">
<div class="section-title">🎨 Warna Tampilan</div>
<input type="color" id="colorPrimary">
<input type="color" id="colorBg">
<button class="btn-primary" onclick="saveTheme()">Simpan Warna</button>
</div>

<!-- WA -->
<div class="section">
<div class="section-title">📱 WhatsApp</div>
<input id="wa1" placeholder="628xxx">
<input id="wa2" placeholder="628xxx">
<input id="wa3" placeholder="628xxx">
<input id="wa4" placeholder="628xxx">
<button class="btn-primary" onclick="saveWA()">Simpan Nomor</button>
</div>

<!-- ITEM -->
<div class="section">
<div class="section-title">🍔 Item & Harga</div>
<div id="listItem">Loading...</div>
<button class="btn-green" onclick="undo()">↩️ Undo Hapus</button>
</div>

<button class="btn-gray" onclick="kembali()">⬅️ Kembali</button>

</div>
</div>

<button class="fab" onclick="showAddForm()">+</button>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>

firebase.initializeApp({
databaseURL:"https://cilok-86ced-default-rtdb.asia-southeast1.firebasedatabase.app/"
});

const db=firebase.database();
let lastDeleted=null;

// LOAD
function loadItems(){
db.ref("items").on("value",snap=>{
let list=document.getElementById("listItem");
list.innerHTML="";

if(!snap.exists()){
list.innerHTML=`<div class="empty">Belum ada item</div>`;
return;
}

let items=[];
snap.forEach(c=>{
items.push({key:c.key,data:c.val()});
});

items.sort((a,b)=>(a.data.urutan||0)-(b.data.urutan||0));

items.forEach((item,index)=>{

let key=item.key;
let data=item.data;

let div=document.createElement("div");
div.className="row";

div.innerHTML=`
<div class="item-info">
<div class="item-name">${data.nama}</div>
<div class="item-price">Rp ${Number(data.harga).toLocaleString("id-ID")}</div>
</div>

<input class="price-input" type="number"
value="${data.harga}"
onchange="updateHarga('${key}',this.value)">

<button class="icon-btn plus-btn" onclick="showInsertForm(${index})">+</button>
<button class="icon-btn delete-btn" onclick="hapusItem('${key}')">🗑️</button>
`;

list.appendChild(div);

});
});
}

// ADD FORM FLOAT
function showAddForm(){

let old=document.getElementById("insertForm");
if(old) old.remove();

let div=document.createElement("div");
div.className="row";
div.id="insertForm";

div.innerHTML=`
<div class="item-info">
<input id="namaItem" placeholder="Nama item">
</div>

<input id="hargaItem" class="price-input" placeholder="Harga">

<button class="icon-btn plus-btn" onclick="tambahItem()">✔</button>
`;

document.querySelector(".card").prepend(div);
}

// INSERT FORM
function showInsertForm(index){
let old=document.getElementById("insertForm");
if(old) old.remove();

let rows=document.querySelectorAll(".row");

let form=document.createElement("div");
form.className="row";
form.id="insertForm";

form.innerHTML=`
<input id="insertNama" placeholder="Nama">
<input id="insertHarga" class="price-input" placeholder="Harga">
<button class="btn-primary" style="width:80px" onclick="sisipkanItem(${index})">OK</button>
`;

rows[index].after(form);
}

// FIREBASE FUNCTIONS (TETAP)
function tambahItem(){
let nama=document.getElementById("namaItem").value;
let harga=document.getElementById("hargaItem").value;

db.ref("items").once("value").then(snap=>{
db.ref("items").push({
nama,
harga:Number(harga),
urutan:snap.numChildren()+1
});
});
}

function updateHarga(key,harga){
db.ref("items/"+key+"/harga").set(Number(harga));
}

function hapusItem(key){
db.ref("items/"+key).once("value").then(snap=>{
lastDeleted={key,value:snap.val()};
db.ref("items/"+key).remove();
});
}

function undo(){
if(!lastDeleted) return alert("Tidak ada data");
db.ref("items/"+lastDeleted.key).set(lastDeleted.value);
lastDeleted=null;
}

function saveLabel(){
db.ref("config/label").set(document.getElementById("labelApp").value);
}

function saveTheme(){
db.ref("config/theme").set({
primary:document.getElementById("colorPrimary").value,
bg:document.getElementById("colorBg").value
});
}

function saveWA(){
db.ref("config/wa").set({
wa1:wa1.value,wa2:wa2.value,wa3:wa3.value,wa4:wa4.value
});
}

function kembali(){
window.location.href="index.html";
}

window.onload=function(){
loadItems();
}

</script>

</body>
</html>
