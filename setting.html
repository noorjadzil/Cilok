<!DOCTYPE html>
<html>
<head>
<title>Setting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Segoe UI;
background:#0f172a;
margin:0;
color:white;
}

.box{
max-width:400px;
margin:auto;
padding:15px;
}

.card{
background:white;
color:black;
padding:15px;
border-radius:16px;
}

input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:10px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#1e3a8a;
color:white;
font-weight:700;
}
</style>
</head>

<body>

<div class="box">
<div class="card">

<h2>Setting WA</h2>

<input id="wa1" placeholder="WA 1 (628xxx)">
<input id="wa2" placeholder="WA 2">
<input id="wa3" placeholder="WA 3">
<input id="wa4" placeholder="WA 4">

<button onclick="save()">Simpan</button>

</div>
</div>

<script>
let db;

let req=indexedDB.open("JajanDB",1);

req.onsuccess=function(e){
db=e.target.result;
load();
};

function tx(store,mode="readwrite"){
return db.transaction(store,mode).objectStore(store);
}

function load(){
let r=tx("config").get("wa");

r.onsuccess=function(){
let data=r.result?.value || [];

for(let i=0;i<4;i++){
document.getElementById("wa"+(i+1)).value=data[i] || "";
}
};
}

function save(){
let arr=[];

for(let i=1;i<=4;i++){
let v=document.getElementById("wa"+i).value;
if(v) arr.push(v);
}

tx("config","readwrite").put({
key:"wa",
value:arr
});

alert("Tersimpan!");
location.href="index.html";
}
</script>

</body>
</html>
