<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAQSHOF</title>

<link rel="manifest" href="manifest.json">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Segoe UI',sans-serif;
background:#0f172a;
min-height:100vh;
color:white;
overflow-x:hidden;
}

.bg{
position:fixed;inset:0;
background:
radial-gradient(circle at top left,#2563eb55,transparent 35%),
radial-gradient(circle at bottom right,#06b6d455,transparent 35%),
linear-gradient(135deg,#020617,#0f172a,#111827);
z-index:-2;
}

.blur1,.blur2{
position:fixed;border-radius:50%;
filter:blur(90px);z-index:-1;
}

.blur1{width:250px;height:250px;background:#2563eb55;top:-50px;left:-50px;}
.blur2{width:250px;height:250px;background:#06b6d455;bottom:-50px;right:-50px;}

.header{
padding:30px 20px 10px;text-align:center;
}

.logo{
font-size:34px;font-weight:900;letter-spacing:4px;
background:linear-gradient(90deg,#60a5fa,#22d3ee);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.sub{margin-top:8px;font-size:14px;color:#94a3b8;}

.container{max-width:480px;margin:auto;padding:15px;}

.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.08);
border-radius:28px;
padding:22px;
}

.section-title{
font-size:13px;font-weight:700;
letter-spacing:1px;color:#94a3b8;
margin:20px 0 10px;
text-transform:uppercase;
}

.input-group{margin-bottom:18px;}

label{
display:block;margin-bottom:8px;
font-size:13px;font-weight:700;color:#cbd5e1;
}

input,textarea,select{
width:100%;
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
border-radius:18px;
padding:15px;
font-size:15px;
color:white;
outline:none;
}
input[type="date"]{
width:100%;
appearance:none;
-webkit-appearance:none;
padding:18px;
font-size:16px;
cursor:pointer;
}

input[type="date"]::-webkit-calendar-picker-indicator{
opacity:0;
position:absolute;
right:0;
width:100%;
height:100%;
cursor:pointer;
}

textarea{resize:none;min-height:100px;}

.item-row{
display:flex;
gap:10px;
padding:12px;
margin-bottom:12px;
border-radius:18px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.06);
align-items:center;
}

.item-name{
flex:2;
font-weight:600;
color:#e2e8f0;
}

.item-row input{
flex:1;
text-align:center;
}

button{
width:100%;
padding:16px;
margin-top:14px;
border:none;
border-radius:20px;
font-size:15px;
font-weight:800;
cursor:pointer;
color:white;
}

.primary-btn{
background:linear-gradient(135deg,#2563eb,#06b6d4);
}

.secondary-btn{
background:rgba(255,255,255,0.06);
border:1px solid rgba(255,255,255,0.08);
}

.footer{
text-align:center;
padding:25px;
font-size:12px;
color:#64748b;
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="blur1"></div>
<div class="blur2"></div>

<div class="header">
<div class="logo">MAQSHOF</div>
<div class="sub">Smart Data Management System</div>
</div>

<div class="container">
<div class="card">

<div class="section-title">Informasi</div>

<div class="input-group">
<label>Tanggal</label>
<input type="date" id="tanggal">
</div>

<div class="input-group">
<label>Lokasi</label>
<select id="tempat" disabled>
<option>Ikhwan</option>
</select>
</div>

<div class="section-title">Input Item</div>
<div id="itemsContainer"></div>

<div class="section-title">Catatan</div>
<textarea id="catatan" placeholder="Tambahkan catatan..."></textarea>

<button class="primary-btn" onclick="kirim()">💾 Simpan Data</button>

<button class="secondary-btn" onclick="location.href='laporan.html'">📊 Laporan</button>

<button class="secondary-btn" onclick="location.href='setting.html'">⚙️ Pengaturan</button>

</div>

<div class="footer">MAQSHOF • Modern Dashboard System</div>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>

firebase.initializeApp({
databaseURL:"https://cilok-86ced-default-rtdb.asia-southeast1.firebasedatabase.app/"
});

const db = firebase.database();

let daftarItems = [];

function loadItems(){
db.ref("items").once("value",snap=>{
daftarItems = [];
snap.forEach(c=>{
let d = c.val();
daftarItems.push(d.nama || d);
});
renderItems();
});
}

function renderItems(){
let c = document.getElementById("itemsContainer");
c.innerHTML = "";

daftarItems.forEach(item=>{
c.innerHTML += `
<div class="item-row">
<div class="item-name">${item}</div>
<input type="number" class="masuk" data-item="${item}" placeholder="Masuk">
<input type="number" class="retur" data-item="${item}" placeholder="Retur">
</div>`;
});
}

async function kirim(){

let hasil = {};

document.querySelectorAll(".masuk").forEach(i=>{
let item = i.dataset.item;
if(!hasil[item]) hasil[item]={barang:item,masuk:0,retur:0};
hasil[item].masuk = Number(i.value||0);
});

document.querySelectorAll(".retur").forEach(i=>{
let item = i.dataset.item;
if(!hasil[item]) hasil[item]={barang:item,masuk:0,retur:0};
hasil[item].retur = Number(i.value||0);
});

let data = {
tanggal:document.getElementById("tanggal").value,
waktu:new Date().toISOString(),
tempat:document.getElementById("tempat").value,
items:Object.values(hasil),
catatan:document.getElementById("catatan").value
};

await db.ref("jajan").push(data);

alert("Tersimpan!");

document.querySelectorAll(".masuk,.retur").forEach(i=>i.value="");
document.getElementById("catatan").value="";
}

window.onload=function(){
document.getElementById("tanggal").value =
new Date().toISOString().split("T")[0];

loadItems();
};

</script>

</body>
</html>
