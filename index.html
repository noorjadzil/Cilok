<!DOCTYPE html>
<html>
<head>
<title>Input Jajan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
font-family:Segoe UI,Arial;
margin:0;
background:linear-gradient(135deg,#0f172a,#1e3a8a);
}

.container{
max-width:450px;
margin:auto;
padding:12px;
}

.card{
background:white;
border-radius:18px;
padding:16px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
text-align:center;
color:#1e3a8a;
margin-bottom:10px;
}

label{
font-weight:700;
font-size:13px;
margin-top:10px;
display:block;
}

input,select,textarea{
width:100%;
padding:10px;
margin-top:5px;
border-radius:10px;
border:1px solid #cbd5f5;
font-weight:600;
box-sizing:border-box;
}

.row{
display:flex;
gap:10px;
align-items:center;
margin-top:8px;
}

.row input, .row select{
flex:1;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#1e3a8a;
color:white;
font-weight:700;
margin-top:10px;
cursor:pointer;
}

.item-box{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0;
border-bottom:1px solid #eee;
}

small{
color:gray;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2 id="judul">Input Jajan</h2>

<label>Foto</label>
<input type="file" id="foto" accept="image/*">

<label>Jenis</label>
<select id="jenis">
<option>Masuk</option>
<option>Sisa</option>
</select>

<label>Tempat</label>
<select id="tempat">
<option>Ikhwan</option>
<option>Akhwat</option>
</select>

<div id="dynamicItems"></div>

<div class="row">
<select id="slot1"></select>
<input type="number" id="slot1_jumlah">
</div>

<div class="row">
<select id="slot2"></select>
<input type="number" id="slot2_jumlah">
</div>

<label>Catatan</label>
<textarea id="catatan"></textarea>

<label>WA Tujuan</label>
<div id="waList"></div>

<button onclick="simpan()">Simpan</button>
<button onclick="location.href='laporan.html'">Laporan</button>

</div>
</div>

<script>
/* =========================
   INDEXEDDB SETUP
========================= */
let db;

let request = indexedDB.open("JajanDB", 1);

request.onupgradeneeded = function(e){
db = e.target.result;

db.createObjectStore("items", {keyPath:"id", autoIncrement:true});
db.createObjectStore("jajan", {keyPath:"id", autoIncrement:true});
db.createObjectStore("config", {keyPath:"key"});
};

request.onsuccess = function(e){
db = e.target.result;

loadAll();
};

/* =========================
   HELPER DB
========================= */
function tx(store,mode="readonly"){
return db.transaction(store,mode).objectStore(store);
}

/* =========================
   LOAD ITEMS
========================= */
function loadItems(){
let container = document.getElementById("dynamicItems");
container.innerHTML="";

let req = tx("items").getAll();

req.onsuccess = function(){
req.result.forEach(item=>{
let div = document.createElement("div");
div.className="item-box";

div.innerHTML=`
<span>${item.nama}</span>
<input type="number" data-nama="${item.nama}">
`;

container.appendChild(div);
});
};
}

/* =========================
   DROPDOWN
========================= */
function loadDropdown(){
let s1=document.getElementById("slot1");
let s2=document.getElementById("slot2");

s1.innerHTML="";
s2.innerHTML="";

let req = tx("items").getAll();

req.onsuccess = function(){
req.result.forEach(item=>{
let opt=document.createElement("option");
opt.value=item.nama;
opt.textContent=item.nama;

s1.appendChild(opt.cloneNode(true));
s2.appendChild(opt.cloneNode(true));
});
};
}

/* =========================
   WA LIST LOCAL CONFIG
========================= */
function loadWA(){
let box=document.getElementById("waList");
box.innerHTML="";

let req = tx("config").get("wa");

req.onsuccess = function(){
let data = req.result?.value || [];

if(data.length===0){
box.innerHTML="<small>Belum ada WA</small>";
return;
}

data.forEach(no=>{
let div=document.createElement("div");
div.innerHTML=`
<label>
<input type="radio" name="wa" value="${no}">
${no}
</label>
`;
box.appendChild(div);
});
};
}

/* =========================
   SIMPAN DATA
========================= */
async function simpan(){

let items=[];

document.querySelectorAll("#dynamicItems input").forEach(i=>{
if(i.value){
items.push({
barang:i.dataset.nama,
jumlah:Number(i.value)
});
}
});

function addSlot(id1,id2){
let b=document.getElementById(id1).value;
let j=document.getElementById(id2).value;

if(b && j){
items.push({barang:b,jumlah:Number(j)});
}
}

addSlot("slot1","slot1_jumlah");
addSlot("slot2","slot2_jumlah");

/* FOTO */
let foto="";
let f=document.getElementById("foto").files[0];
if(f) foto=await compress(f);

/* DATA */
let data={
waktu:new Date().toISOString(),
tempat:document.getElementById("tempat").value,
jenis:document.getElementById("jenis").value,
items,
catatan:document.getElementById("catatan").value,
foto
};

/* SAVE INDEXEDDB */
tx("jajan","readwrite").add(data);

/* WA */
let selected=document.querySelector('input[name="wa"]:checked');

if(selected){
let teks=`${data.jenis} - ${data.tempat}\n\n`;

data.items.forEach(i=>{
teks+=`${i.barang} ${i.jumlah}\n`;
});

let url=`https://wa.me/${selected.value}?text=${encodeURIComponent(teks)}`;
window.location.href=url;
}

alert("Tersimpan!");
location.reload();
}

/* =========================
   COMPRESS IMAGE
========================= */
function compress(file){
return new Promise(res=>{
let r=new FileReader();
r.onload=e=>{
let img=new Image();
img.src=e.target.result;

img.onload=()=>{
let c=document.createElement("canvas");
let scale=400/img.width;

c.width=400;
c.height=img.height*scale;

let ctx=c.getContext("2d");
ctx.drawImage(img,0,0,c.width,c.height);

res(c.toDataURL("image/jpeg",0.6));
};
};
r.readAsDataURL(file);
});
}

/* =========================
   LOAD ALL
========================= */
function loadAll(){
loadItems();
loadDropdown();
loadWA();
}
</script>

</body>
</html>
