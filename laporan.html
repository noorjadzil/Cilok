<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan MAQSHOF</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:#0b1220;
color:#fff;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#111827;
position:sticky;
top:0;
z-index:10;
}

.header a{
color:#fff;
text-decoration:none;
background:#2563eb;
padding:6px 10px;
border-radius:8px;
font-size:13px;
}

.container{max-width:1000px;margin:auto;padding:12px}

.tab{
display:flex;
gap:6px;
margin-top:10px;
}

.tab button{
flex:1;
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
color:#fff;
}

.active{background:#2563eb}
.nonactive{background:#1f2937}

.card{
background:#111827;
padding:12px;
border-radius:12px;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
font-size:12px;
margin-top:10px;
}

th,td{
border-bottom:1px solid #1f2937;
padding:6px;
text-align:center;
white-space:nowrap;
}

.scroll{overflow-x:auto}

.badge{
display:inline-block;
padding:3px 8px;
border-radius:999px;
background:#1f2937;
font-size:11px;
margin-left:6px;
}
</style>
</head>

<body>

<div class="header">
<div><b>📊 Laporan MAQSHOF</b></div>
<a href="index.html">⬅ Kembali</a>
</div>

<div class="container">

<div class="tab">
<button id="b1" class="active" onclick="showTab('laporan')">Laporan</button>
<button id="b2" class="nonactive" onclick="showTab('harian')">Harian</button>
<button id="b3" class="nonactive" onclick="showTab('bulanan')">Bulanan</button>
</div>

<div id="laporan" class="card"></div>

<div id="harian" class="card" style="display:none"></div>

<div id="bulanan" class="card" style="display:none"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>

firebase.initializeApp({
databaseURL:"https://cilok-86ced-default-rtdb.asia-southeast1.firebasedatabase.app/"
});

const db=firebase.database();

/* ================= TAB ================= */
function showTab(t){
document.getElementById("laporan").style.display=(t==="laporan")?"block":"none";
document.getElementById("harian").style.display=(t==="harian")?"block":"none";
document.getElementById("bulanan").style.display=(t==="bulanan")?"block":"none";

document.getElementById("b1").className=(t==="laporan")?"active":"nonactive";
document.getElementById("b2").className=(t==="harian")?"active":"nonactive";
document.getElementById("b3").className=(t==="bulanan")?"active":"nonactive";
}

/* ================= LAPORAN ================= */
function loadLaporan(){

db.ref("jajan").limitToLast(20).once("value",snap=>{

let box=document.getElementById("laporan");
box.innerHTML="";

if(!snap.exists()){
box.innerHTML="Belum ada data";
return;
}

let arr=[];
snap.forEach(c=>arr.push(c.val()));
arr.reverse();

arr.forEach(d=>{

let items=(d.items||[]).map(i=>{
if(!i) return "";
return `• ${i.barang} = Masuk:${i.masuk||0} | Retur:${i.retur||0}`;
}).join("<br>");

box.innerHTML+=`
<div class="card">
<small>${new Date(d.waktu||Date.now()).toLocaleString()}</small>
<br><br>
${items}
</div>`;
});

});

}

/* ================= HARIAN ================= */
function loadHarian(){

db.ref("jajan").limitToLast(200).once("value",snap=>{

let data={};
let tanggalSet=new Set();

snap.forEach(c=>{
let d=c.val();
let tgl=(d.waktu||"").slice(0,10);
tanggalSet.add(tgl);

(d.items||[]).forEach(i=>{

if(!i) return;

let nama=i.barang;
let masuk=Number(i.masuk||0);
let retur=Number(i.retur||0);

if(!data[nama]) data[nama]={};
if(!data[nama][tgl]) data[nama][tgl]={masuk:0,retur:0};

data[nama][tgl].masuk+=masuk;
data[nama][tgl].retur+=retur;

});
});

let tglArr=[...tanggalSet].sort();

let html=`<div class="scroll"><table><tr><th>Item</th><th>Type</th>`;

tglArr.forEach(t=>{
html+=`<th>${t.split("-")[2]}</th>`;
});

html+=`</tr>`;

Object.keys(data).forEach(item=>{

html+=`<tr><td rowspan="2"><b>${item}</b></td><td>Masuk</td>`;

tglArr.forEach(t=>{
html+=`<td>${data[item][t]?.masuk||0}</td>`;
});

html+=`</tr><tr><td>Retur</td>`;

tglArr.forEach(t=>{
html+=`<td>${data[item][t]?.retur||0}</td>`;
});

html+=`</tr>`;
});

html+=`</table></div>`;

document.getElementById("harian").innerHTML=html;

});

}

/* ================= BULANAN ================= */
function loadBulanan(){

db.ref("items").once("value",itemSnap=>{

let harga={};

itemSnap.forEach(c=>{
let d=c.val();
harga[(d.nama||"").toLowerCase()] = Number(d.harga||0);
});

db.ref("jajan").limitToLast(200).once("value",snap=>{

let grup={};

snap.forEach(c=>{
let d=c.val();
let bulan=(d.waktu||"").slice(0,7);

if(!grup[bulan]) grup[bulan]={};

(d.items||[]).forEach(i=>{

if(!i) return;

let nama=(i.barang||"").toLowerCase();
let masuk=Number(i.masuk||0);
let retur=Number(i.retur||0);

if(!grup[bulan][nama]){
grup[bulan][nama]={masuk:0,retur:0,harga:harga[nama]||0};
}

grup[bulan][nama].masuk+=masuk;
grup[bulan][nama].retur+=retur;

});

});

let html="";

Object.keys(grup).forEach(b=>{

let total=0;

html+=`<h3>${b} <span class="badge">Bulanan</span></h3>
<div class="scroll"><table>
<tr><th>Item</th><th>Masuk</th><th>Retur</th><th>Terjual</th><th>Total</th></tr>`;

Object.keys(grup[b]).forEach(item=>{

let g=grup[b][item];
let terjual=Math.max(g.masuk-g.retur,0);
let tot=terjual*g.harga;
total+=tot;

html+=`
<tr>
<td>${item}</td>
<td>${g.masuk}</td>
<td>${g.retur}</td>
<td>${terjual}</td>
<td>${tot.toLocaleString("id-ID")}</td>
</tr>`;
});

html+=`</table></div><b>Total: Rp ${total.toLocaleString("id-ID")}</b><br><br>`;
});

document.getElementById("bulanan").innerHTML=html;

});

}

/* INIT */
window.onload=function(){
showTab("laporan");
loadLaporan();
loadHarian();
loadBulanan();
};

</script>

</body>
</html>
