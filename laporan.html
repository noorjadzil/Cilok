<!DOCTYPE html>
<html>
<head>
<title>Laporan Jajan Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
margin:0;
font-family:Segoe UI;
background:#0b1220;
color:#fff;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
background:#111827;
position:sticky;
top:0;
z-index:10;
}

.header a{
color:#fff;
text-decoration:none;
background:#2563eb;
padding:6px 10px;
border-radius:8px;
font-size:13px;
}

.container{max-width:1000px;margin:auto;padding:12px}

.tab{
display:flex;
gap:6px;
margin-top:10px;
}

.tab button{
flex:1;
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
color:#fff;
}

.active{background:#2563eb}
.nonactive{background:#1f2937}

.card{
background:#111827;
padding:12px;
border-radius:12px;
margin-top:10px;
}

table{
width:100%;
border-collapse:collapse;
font-size:12px;
margin-top:10px;
}

th,td{
border-bottom:1px solid #1f2937;
padding:6px;
text-align:center;
white-space:nowrap;
}

.scroll{overflow-x:auto}

.badge{
display:inline-block;
padding:3px 8px;
border-radius:999px;
background:#1f2937;
font-size:11px;
margin-left:6px;
}
</style>
</head>

<body>

<div class="header">
<div><b>📊 Laporan Jajan</b></div>
<a href="index.html">⬅ Kembali</a>
</div>

<div class="container">

<div class="tab">
<button id="b1" class="active" onclick="showTab('laporan')">Laporan</button>
<button id="b2" class="nonactive" onclick="showTab('harian')">Harian</button>
<button id="b3" class="nonactive" onclick="showTab('bulanan')">Bulanan</button>
</div>

<div id="laporan" class="card"></div>

<button onclick="loadMore()" style="width:100%;padding:10px;margin-top:10px;border:none;border-radius:10px;background:#06b6d4">
Muat Lagi
</button>

<div id="harian" class="card" style="display:none"></div>
<div id="bulanan" class="card" style="display:none"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>

firebase.initializeApp({
databaseURL:"https://cilok-86ced-default-rtdb.asia-southeast1.firebasedatabase.app/"
});

const db=firebase.database();

let limit=8;

/* ================= AMAN PARSER (INI KUNCI FIX) ================= */
function norm(t){
return (t||"").toString().toLowerCase().trim();
}

function detectType(t){
t = norm(t);
if(t.includes("masuk")) return "masuk";
if(t.includes("retur")) return "retur";
if(t.includes("sisa")) return "retur";
return "unknown";
}

function getDateKey(t){
let d=new Date(t);
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0')+"-"+String(d.getDate()).padStart(2,'0');
}

function getMonthKey(t){
let d=new Date(t);
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,'0');
}

function monthName(m){
const nama=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
let [y,mm]=m.split("-");
return nama[parseInt(mm)-1]+" "+y;
}

/* ================= TAB ================= */
function showTab(t){

document.getElementById("laporan").style.display=(t==="laporan")?"block":"none";
document.getElementById("harian").style.display=(t==="harian")?"block":"none";
document.getElementById("bulanan").style.display=(t==="bulanan")?"block":"none";

document.getElementById("b1").className=(t==="laporan")?"active":"nonactive";
document.getElementById("b2").className=(t==="harian")?"active":"nonactive";
document.getElementById("b3").className=(t==="bulanan")?"active":"nonactive";
}

/* ================= LAPORAN ================= */
function loadLaporan(){

db.ref("jajan").limitToLast(limit).once("value",snap=>{

let box=document.getElementById("laporan");
box.innerHTML="";

if(!snap.exists()){
box.innerHTML="Belum ada data";
return;
}

let arr=[];
snap.forEach(c=>arr.push(c.val()));
arr.reverse();

arr.forEach(d=>{

let items=(d.items||[]).map(i=>{
return `• ${i.barang} = ${i.jumlah}`;
}).join("<br>");

box.innerHTML+=`
<div class="card">
<b>${d.jenis}</b><br>
<small>${new Date(d.waktu).toLocaleString()}</small>
<br><br>
${items}
</div>`;
});

});

}

function loadMore(){
limit+=5;
loadLaporan();
}

/* ================= HARIAN ================= */
function loadHarian(){

db.ref("jajan").once("value",snap=>{

let data={};
let tanggalSet=new Set();

snap.forEach(c=>{
let d=c.val();
let tgl=getDateKey(d.waktu);
tanggalSet.add(tgl);

let type=detectType(d.jenis);

(d.items||[]).forEach(i=>{

let nama=i.barang;
let j=Number(i.jumlah||0);

if(!data[nama]) data[nama]={};
if(!data[nama][tgl]) data[nama][tgl]={masuk:0,retur:0};

if(type==="masuk") data[nama][tgl].masuk+=j;
if(type==="retur") data[nama][tgl].retur+=j;

});
});

let tglArr=[...tanggalSet].sort();

let html=`<div class="scroll"><table><thead><tr><th>Item</th><th>Type</th>`;

tglArr.forEach(t=>{
html+=`<th>${t.split("-")[2]}</th>`;
});

html+=`</tr></thead><tbody>`;

Object.keys(data).forEach(item=>{

html+=`<tr><td rowspan="2"><b>${item}</b></td><td>Masuk</td>`;

tglArr.forEach(t=>{
html+=`<td>${data[item][t]?.masuk||0}</td>`;
});

html+=`</tr><tr><td>Retur</td>`;

tglArr.forEach(t=>{
html+=`<td>${data[item][t]?.retur||0}</td>`;
});

html+=`</tr>`;
});

html+=`</tbody></table></div>`;

document.getElementById("harian").innerHTML=html;

});

}

/* ================= BULANAN ================= */
function loadBulanan(){

db.ref("items").once("value",itemSnap=>{

let harga={};

itemSnap.forEach(c=>{
let d=c.val();
harga[norm(d.nama)] = Number(d.harga||0);
});

db.ref("jajan").once("value",snap=>{

let grup={};

snap.forEach(c=>{
let d=c.val();
let bulan=getMonthKey(d.waktu);

if(!grup[bulan]) grup[bulan]={};

let type=detectType(d.jenis);

(d.items||[]).forEach(i=>{

let nama=norm(i.barang);
let j=Number(i.jumlah||0);

if(!grup[bulan][nama]){
grup[bulan][nama]={masuk:0,retur:0,harga:harga[nama]||0};
}

if(type==="masuk") grup[bulan][nama].masuk+=j;
if(type==="retur") grup[bulan][nama].retur+=j;

});

});

let html="";

Object.keys(grup).forEach(b=>{

let total=0;

html+=`<h3>${monthName(b)} <span class="badge">Monthly</span></h3>
<div class="scroll"><table>
<tr>
<th>Item</th><th>Masuk</th><th>Retur</th><th>Terjual</th><th>Total</th>
</tr>`;

Object.keys(grup[b]).forEach(item=>{

let g=grup[b][item];
let terjual=Math.max(g.masuk-g.retur,0);
let tot=terjual*g.harga;
total+=tot;

html+=`
<tr>
<td>${item}</td>
<td>${g.masuk}</td>
<td>${g.retur}</td>
<td>${terjual}</td>
<td>${tot}</td>
</tr>`;
});

html+=`</table></div>
<b>Total ${monthName(b)}: Rp ${total.toLocaleString("id-ID")}</b><br><br>`;
});

document.getElementById("bulanan").innerHTML=html;

});

});

}

/* INIT */
window.onload=function(){
showTab("laporan");
loadLaporan();
loadHarian();
loadBulanan();
};

</script>

</body>
</html>
