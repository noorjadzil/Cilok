<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan MAQSHOF</title>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#020617;
color:white;
padding:14px;
}

.container{
max-width:1000px;
margin:auto;
}

h2{
text-align:center;
margin-bottom:14px;
}

/* TAB */
.tab{
display:flex;
gap:8px;
margin-bottom:14px;
}

.tab button{
flex:1;
padding:12px;
border:none;
border-radius:14px;
font-weight:800;
cursor:pointer;
color:white;
}

.active{
background:linear-gradient(135deg,#2563eb,#06b6d4);
}

.nonactive{
background:rgba(255,255,255,0.06);
}

/* CARD */
.card{
background:#111827;
padding:12px;
border-radius:14px;
margin-bottom:10px;
}

/* TABLE */
table{
width:100%;
border-collapse:collapse;
font-size:11px;
min-width:900px;
}

th,td{
border:1px solid #1f2937;
padding:6px;
text-align:center;
white-space:nowrap;
}

th{
background:#0f172a;
}

/* SCROLL */
.scroll{
overflow-x:auto;
}

.more-btn{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:12px;
background:rgba(255,255,255,0.06);
color:white;
font-weight:800;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h2>📊 Laporan MAQSHOF</h2>

<div class="tab">

<button id="btn1" class="active" onclick="openTab('terbaru')">
Terbaru
</button>

<button id="btn2" class="nonactive" onclick="openTab('bulanan')">
Bulanan
</button>

</div>

<!-- TERBARU -->
<div id="tabTerbaru"></div>

<!-- BULANAN -->
<div id="tabBulanan" style="display:none"></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>

firebase.initializeApp({
databaseURL:"https://cilok-86ced-default-rtdb.asia-southeast1.firebasedatabase.app/"
});

const db = firebase.database();

let allData = [];
let limit = 3;

/* SAFE */
function num(v){
v = Number(v);
return isNaN(v) ? 0 : v;
}

/* BULAN */
function getBulan(tgl){
let d = new Date(tgl);
return d.toLocaleDateString("id-ID",{month:"long",year:"numeric"});
}

/* LOAD */
function load(){

db.ref("jajan").once("value", snap=>{

allData = [];

snap.forEach(c=>{
allData.push(c.val());
});

allData.reverse();

renderTerbaru();
renderBulanan();

});

}

/* TAB */
function openTab(t){

document.getElementById("tabTerbaru").style.display = t==="terbaru"?"block":"none";
document.getElementById("tabBulanan").style.display = t==="bulanan"?"block":"none";

document.getElementById("btn1").className = t==="terbaru"?"active":"nonactive";
document.getElementById("btn2").className = t==="bulanan"?"active":"nonactive";

}

/* ================= TERBARU ================= */
function renderTerbaru(){

let box = document.getElementById("tabTerbaru");

box.innerHTML = "";

let data = allData.slice(0, limit);

data.forEach(d=>{

let items = (Array.isArray(d.items)?d.items:Object.values(d.items||{}))
.filter(i=>i && i.barang);

let html = items.map(i=>`
<div style="padding:4px 0;border-bottom:1px solid #1f2937">
${i.barang} | ${num(i.masuk)} / ${num(i.retur)}
</div>
`).join("");

box.innerHTML += `
<div class="card">
<b>${d.tanggal}</b> • ${d.tempat}
${html}
</div>
`;

});

if(allData.length > limit){
box.innerHTML += `
<button class="more-btn" onclick="loadMore()">
Lihat 10 lagi
</button>
`;
}

}

function loadMore(){
limit += 10;
renderTerbaru();
}

/* ================= BULANAN (1–31) ================= */
function renderBulanan(){

let box = document.getElementById("tabBulanan");

let grup = {};

/* KUMPULKAN DATA */
allData.forEach(d=>{

if(!d.tanggal) return;

let day = d.tanggal.split("-")[2];
let bulan = getBulan(d.tanggal);

if(!grup[bulan]){
grup[bulan] = {items:{}};
}

let items = (Array.isArray(d.items)?d.items:Object.values(d.items||{}))
.filter(i=>i && i.barang);

items.forEach(i=>{

let nama = i.barang;

let masuk = num(i.masuk);
let retur = num(i.retur);

if(!grup[bulan].items[nama]){
grup[bulan].items[nama] = {};
}

if(!grup[bulan].items[nama][day]){
grup[bulan].items[nama][day] = {
masuk:0,
retur:0
};
}

grup[bulan].items[nama][day].masuk += masuk;
grup[bulan].items[nama][day].retur += retur;

});

});

/* RENDER */
let html = "";

Object.keys(grup).forEach(bulan=>{

html += `
<div class="card">

<h3>📊 Laporan Bulan ${bulan}</h3>

<div class="scroll">
<table>

<tr>
<th>Item</th>
<th>Type</th>
`;

/* 1–31 HEADER */
for(let i=1;i<=31;i++){
html += `<th>${i}</th>`;
}

html += `</tr>`;

Object.keys(grup[bulan].items).forEach(item=>{

/* MASUK */
html += `
<tr>
<td rowspan="2"><b>${item}</b></td>
<td>Masuk</td>
`;

for(let i=1;i<=31;i++){
let key = String(i).padStart(2,"0");
html += `<td>${grup[bulan].items[item][key]?.masuk || 0}</td>`;
}

html += `</tr>`;

/* RETUR */
html += `
<tr>
<td>Retur</td>
`;

for(let i=1;i<=31;i++){
let key = String(i).padStart(2,"0");
html += `<td>${grup[bulan].items[item][key]?.retur || 0}</td>`;
}

html += `</tr>`;

});

html += `
</table>
</div>

</div>
`;

});

box.innerHTML = html;

}

/* INIT */
load();

</script>

</body>
</html>
