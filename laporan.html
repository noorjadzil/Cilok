<!DOCTYPE html>
<html>
<head>
<title>Laporan Jajan</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<style>
/* ====== (CSS kamu tetap, saya ringkas biar fokus perubahan) ====== */
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#020617;color:white;padding:14px;}

.container{max-width:500px;margin:auto;}
.card{background:rgba(255,255,255,0.05);padding:20px;border-radius:20px;}

h2{text-align:center;margin-bottom:15px}

/* TAB */
.tab-wrap{display:flex;gap:8px;margin-bottom:15px}
.tab-btn{flex:1;padding:12px;border-radius:14px;border:none;color:white}
.active{background:#2563eb}
.nonactive{background:rgba(255,255,255,0.1)}

/* CARD */
.laporan-card{background:rgba(255,255,255,0.05);padding:14px;border-radius:16px;margin-top:10px}

/* TABLE */
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th,td{padding:8px;border-bottom:1px solid rgba(255,255,255,0.1);text-align:left}

/* BUTTON */
button{cursor:pointer}

.loadmore{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
border:none;
background:#06b6d4;
color:white;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>Laporan Jajan</h2>

<button onclick="kembali()">⬅️ Kembali</button>

<!-- TAB -->
<div class="tab-wrap">
<button id="btn1" class="tab-btn active" onclick="showTab('laporan')">Laporan</button>
<button id="btn2" class="tab-btn nonactive" onclick="showTab('harian')">Rekap Harian</button>
<button id="btn3" class="tab-btn nonactive" onclick="showTab('bulanan')">Rekap Bulanan</button>
</div>

<!-- LAPORAN -->
<div id="tabLaporan"></div>
<button class="loadmore" onclick="loadMore()">Muat lebih banyak</button>

<!-- HARIAN -->
<div id="tabHarian" style="display:none"></div>

<!-- BULANAN -->
<div id="tabBulanan" style="display:none"></div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
databaseURL:"https://cilok-86ced-default-rtdb.asia-southeast1.firebasedatabase.app/"
});

const db=firebase.database();

/* ================= NAV ================= */
let limit = 5;

function kembali(){
window.location.href="index.html";
}

function showTab(t){

document.getElementById("tabLaporan").style.display = (t==="laporan")?"block":"none";
document.getElementById("tabHarian").style.display = (t==="harian")?"block":"none";
document.getElementById("tabBulanan").style.display = (t==="bulanan")?"block":"none";

document.getElementById("btn1").className="tab-btn "+(t==="laporan"?"active":"nonactive");
document.getElementById("btn2").className="tab-btn "+(t==="harian"?"active":"nonactive");
document.getElementById("btn3").className="tab-btn "+(t==="bulanan"?"active":"nonactive");

}

/* default tampil */
showTab("laporan");

/* ================= LAPORAN ================= */
function loadLaporan(){

db.ref("jajan").limitToLast(limit).once("value",snap=>{

let box=document.getElementById("tabLaporan");
box.innerHTML="";

if(!snap.exists()){
box.innerHTML="Belum ada data";
return;
}

let data=[];
snap.forEach(c=>{
data.push({key:c.key,...c.val()});
});

data.reverse();

data.forEach(d=>{
box.innerHTML+=`
<div class="laporan-card">
<b>${d.jenis} - ${d.tempat}</b><br>
<small>${new Date(d.waktu).toLocaleString()}</small>
</div>
`;
});

});

}

function loadMore(){
limit += 5;
loadLaporan();
}

/* ================= HARIAN ================= */
function loadHarian(){

db.ref("jajan").once("value",snap=>{

let box=document.getElementById("tabHarian");
box.innerHTML="";

let grup={};

snap.forEach(c=>{
let d=c.val();
let t=new Date(d.waktu).toLocaleDateString("id-ID");

if(!grup[t]){
grup[t]={masuk:0,sisa:0};
}

(d.items||[]).forEach(i=>{
let j=Number(i.jumlah||0);

if((d.jenis||"").includes("masuk")) grup[t].masuk+=j;
if((d.jenis||"").includes("sisa")) grup[t].sisa+=j;
});
});

let no=1;

let html=`<table>
<tr><th>No</th><th>Tanggal</th><th>Masuk</th><th>Sisa</th></tr>`;

Object.keys(grup).forEach(k=>{
html+=`
<tr>
<td>${no++}</td>
<td>${k}</td>
<td>${grup[k].masuk}</td>
<td>${grup[k].sisa}</td>
</tr>`;
});

box.innerHTML=html+"</table>";

});

}

/* ================= BULANAN (FIX TOTAL BRACKET ERROR) ================= */
function loadBulanan(){

db.ref("jajan").once("value",snap=>{

db.ref("items").once("value",snap2=>{

let hargaMap={};

snap2.forEach(c=>{
let d=c.val();
hargaMap[(d.nama||"").toLowerCase()] = Number(d.harga||0);
});

let box=document.getElementById("tabBulanan");
box.innerHTML="";

let grup={};

snap.forEach(c=>{
let d=c.val();

let date=new Date(d.waktu);
let bulan = date.getFullYear()+"-"+(date.getMonth()+1);

if(!grup[bulan]) grup[bulan]={};

(d.items||[]).forEach(i=>{

let nama=i.barang.toLowerCase();
let j=Number(i.jumlah||0);
let h=hargaMap[nama]||0;

if(!grup[bulan][nama]){
grup[bulan][nama]={masuk:0,sisa:0,harga:h};
}

if((d.jenis||"").includes("masuk")) grup[bulan][nama].masuk+=j;
if((d.jenis||"").includes("sisa")) grup[bulan][nama].sisa+=j;

});

});

let no=1;
let totalAll=0;

let html=`<table>
<tr>
<th>No</th><th>Item</th><th>Masuk</th><th>Sisa</th>
<th>Harga</th><th>Terjual</th><th>Total</th>
</tr>`;

Object.keys(grup).forEach(b=>{
Object.keys(grup[b]).forEach(item=>{

let g=grup[b][item];
let terjual=g.masuk-g.sisa;
if(terjual<0) terjual=0;

let total=terjual*g.harga;
totalAll+=total;

html+=`
<tr>
<td>${no++}</td>
<td>${item}</td>
<td>${g.masuk}</td>
<td>${g.sisa}</td>
<td>${g.harga}</td>
<td>${terjual}</td>
<td>${total}</td>
</tr>`;
});

});

box.innerHTML = html + `</table><br>
<b>Total Keseluruhan: Rp ${totalAll.toLocaleString()}</b>`;

});

});

}

/* INIT */
loadLaporan();
loadHarian();
loadBulanan();

</script>

</body>
</html>
