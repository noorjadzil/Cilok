<!DOCTYPE html>
<html>
<head>
<title>Laporan Jajan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Segoe UI;background:#020617;color:#fff;padding:14px}
.container{max-width:700px;margin:auto}
.card{background:rgba(255,255,255,0.06);padding:16px;border-radius:14px}

.tab{display:flex;gap:6px;margin:10px 0}
.tab button{flex:1;padding:10px;border:none;border-radius:10px;color:white;cursor:pointer}
.active{background:#2563eb}
.nonactive{background:rgba(255,255,255,0.1)}

.laporan-card{background:rgba(255,255,255,0.05);padding:12px;border-radius:12px;margin-top:10px}

table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
th,td{border-bottom:1px solid #333;padding:6px;text-align:center}

.loadmore{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:10px;
background:#06b6d4;
font-weight:bold;
cursor:pointer;
}

.sticky{
position:sticky;
left:0;
background:#0b1220;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h2>Laporan Jajan</h2>

<div class="tab">
<button id="b1" class="active" onclick="showTab('laporan')">Laporan</button>
<button id="b2" class="nonactive" onclick="showTab('harian')">Rekap Harian</button>
<button id="b3" class="nonactive" onclick="showTab('bulanan')">Rekap Bulanan</button>
</div>

<div id="laporan"></div>
<button class="loadmore" onclick="loadMore()">Muat Lagi</button>

<div id="harian" style="display:none"></div>
<div id="bulanan" style="display:none"></div>

</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>

firebase.initializeApp({
databaseURL:"https://cilok-86ced-default-rtdb.asia-southeast1.firebasedatabase.app/"
});

const db=firebase.database();

let limit=5;

/* ================= TAB ================= */
function showTab(t){

document.getElementById("laporan").style.display=(t==="laporan")?"block":"none";
document.getElementById("harian").style.display=(t==="harian")?"block":"none";
document.getElementById("bulanan").style.display=(t==="bulanan")?"block":"none";

document.getElementById("b1").className=(t==="laporan")?"active":"nonactive";
document.getElementById("b2").className=(t==="harian")?"active":"nonactive";
document.getElementById("b3").className=(t==="bulanan")?"active":"nonactive";

}

/* ================= NORMAL ================= */
function norm(t){
return (t||"").toString().trim().toLowerCase();
}

/* ================= LAPORAN ================= */
function loadLaporan(){

db.ref("jajan").limitToLast(limit).once("value",snap=>{

let box=document.getElementById("laporan");
box.innerHTML="";

if(!snap.exists()){
box.innerHTML="Belum ada data";
return;
}

let arr=[];
snap.forEach(c=>arr.push(c.val()));

arr.reverse();

arr.forEach(d=>{
let items=(d.items||[]).map(i=>`• ${i.barang} = ${i.jumlah}`).join("<br>");

box.innerHTML+=`
<div class="laporan-card">
<b>${d.jenis} - ${d.tempat}</b><br>
<small>${new Date(d.waktu).toLocaleString()}</small>
<br><br>
${items}
</div>`;
});

});

}

function loadMore(){
limit+=5;
loadLaporan();
}

/* ================= HARIAN (PIVOT RAPI) ================= */
function loadHarian(){

db.ref("jajan").once("value",snap=>{

let box=document.getElementById("harian");

let data={};
let tanggalSet=new Set();

/* kumpulkan */
snap.forEach(c=>{
let d=c.val();
let tgl=new Date(d.waktu).getDate();
tanggalSet.add(tgl);

(d.items||[]).forEach(i=>{

let item=i.barang;
let j=Number(i.jumlah||0);

if(!data[item]) data[item]={};
if(!data[item][tgl]) data[item][tgl]={masuk:0,retur:0};

let jenis=norm(d.jenis);

if(jenis.includes("masuk")) data[item][tgl].masuk+=j;
if(jenis.includes("sisa")||jenis.includes("retur")) data[item][tgl].retur+=j;

});
});

let tglArr=[...tanggalSet].sort((a,b)=>a-b);

/* table */
let html=`
<div style="overflow-x:auto">
<table>
<thead>
<tr>
<th rowspan="2" class="sticky">Item</th>
<th rowspan="2">Type</th>`;

tglArr.forEach(t=>html+=`<th>${t}</th>`);

html+=`</tr></thead><tbody>`;

/* isi */
Object.keys(data).forEach(item=>{

/* MASUK */
html+=`
<tr>
<td rowspan="2" class="sticky" style="text-align:center;vertical-align:middle">${item}</td>
<td>Masuk</td>`;

tglArr.forEach(t=>{
html+=`<td>${data[item][t]?.masuk||0}</td>`;
});

html+=`</tr>`;

/* RETUR */
html+=`
<tr>
<td>Retur</td>`;

tglArr.forEach(t=>{
html+=`<td>${data[item][t]?.retur||0}</td>`;
});

html+=`</tr>`;

});

box.innerHTML=html+"</tbody></table></div>";

});

}

/* ================= BULANAN ================= */
function loadBulanan(){

db.ref("items").once("value",itemSnap=>{

let harga={};

itemSnap.forEach(c=>{
let d=c.val();
harga[norm(d.nama)] = Number(d.harga||0);
});

db.ref("jajan").once("value",snap=>{

let box=document.getElementById("bulanan");

let grup={};

snap.forEach(c=>{
let d=c.val();
let bulan=new Date(d.waktu).getFullYear()+"-"+(new Date(d.waktu).getMonth()+1);

if(!grup[bulan]) grup[bulan]={};

(d.items||[]).forEach(i=>{

let nama=norm(i.barang);
let j=Number(i.jumlah||0);

if(!grup[bulan][nama]){
grup[bulan][nama]={masuk:0,retur:0,harga:harga[nama]||0};
}

let jenis=norm(d.jenis);

if(jenis.includes("masuk")) grup[bulan][nama].masuk+=j;
if(jenis.includes("sisa")||jenis.includes("retur")) grup[bulan][nama].retur+=j;

});

});

let no=1;
let total=0;

let html=`
<table>
<tr>
<th>No</th><th>Item</th><th>Masuk</th><th>Sisa/Retur</th>
<th>Harga</th><th>Terjual</th><th>Total</th>
</tr>`;

Object.keys(grup).forEach(b=>{
Object.keys(grup[b]).forEach(item=>{

let g=grup[b][item];
let terjual=g.masuk-g.retur;
if(terjual<0) terjual=0;

let tot=terjual*g.harga;
total+=tot;

html+=`
<tr>
<td>${no++}</td>
<td>${item}</td>
<td>${g.masuk}</td>
<td>${g.retur}</td>
<td>${g.harga}</td>
<td>${terjual}</td>
<td>${tot}</td>
</tr>`;
});

});

box.innerHTML=html+`</table><br>
<b>Total: Rp ${total.toLocaleString("id-ID")}</b>`;

});

});

}

/* INIT */
window.onload=function(){
showTab("laporan");
loadLaporan();
loadHarian();
loadBulanan();
};

</script>

</body>
</html>
